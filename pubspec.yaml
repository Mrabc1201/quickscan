name: quickscan
description: Free document scanner, no watermark.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_document_scanner: ^0.3.0
  google_mobile_ads: ^5.3.0
  path_provider: ^2.1.3
  share_plus: ^10.1.4
  open_filex: ^4.5.0
  pdf: ^3.11.0

flutter:
  uses-material-design: true
