name: Smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - smoke.sh
      - .github/workflows/smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare project
        shell: bash
        run: |
          flutter create --platforms=android --org com.quickscan --project-name quickscan app
          cp pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r lib app/lib
          rm -rf app/test
          python3 ci_patch.py app
          python3 fix.py
      - name: Build release x64 APK
        shell: bash
        run: |
          cd app
          flutter pub get
          flutter build apk --release --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: bash smoke.sh
      - name: Save smoke log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp smoke_*.txt smoke_screen.png /tmp/out/ 2>/dev/null || true
          grep -iE "FATAL|AndroidRuntime|UnsatisfiedLink|flutter|quickscan|Exception|crash" smoke_logcat_full.txt | tail -150 > /tmp/out/smoke_filtered.txt || true
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan smokelog
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdxq
          cp /tmp/out/* . 2>/dev/null || true
          git add -A
          git commit -m "smoke log"
          git push -f origin smokelog
