name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare project
        run: |
          flutter create --platforms=android --org com.quickscan --project-name quickscan app
          cp pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r lib app/lib
          rm -rf app/test
          python3 ci_patch.py app
      - name: Build APK
        run: cd app && flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quickscan-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
