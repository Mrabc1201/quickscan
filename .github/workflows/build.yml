name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare project
        shell: bash
        run: |
          flutter create --platforms=android --org com.quickscan --project-name quickscan app 2>&1 | tee build.log
          cp pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r lib app/lib
          rm -rf app/test
          python3 ci_patch.py app 2>&1 | tee -a build.log
      - name: Build APK
        shell: bash
        run: |
          cd app
          flutter pub get 2>&1 | tee -a ../build.log
          flutter build apk --release 2>&1 | tee -a ../build.log
      - name: Save build log
        if: always()
        shell: bash
        run: |
          tail -n 300 build.log > /tmp/build_log.txt || echo "no log" > /tmp/build_log.txt
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan buildlog
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/build_log.txt build_log.txt
          git add build_log.txt
          git commit -m "build log"
          git push -f origin buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: quickscan-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
